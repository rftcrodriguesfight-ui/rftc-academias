<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFTC Sistema</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0b0b;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
  padding:25px 18px;
}

.logo{
  text-align:center;
  margin:30px 0;
}

.logo h1{
  font-size:32px;
  letter-spacing:2px;
}

.logo span{
  color:#d6a928;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:18px;
  padding:25px;
  box-shadow:0 10px 30px #000;
}

h2{
  margin-bottom:8px;
}

.subtitle{
  color:#aaa;
  margin-bottom:25px;
}

input,select{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #333;
  background:#222;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#d6a928;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#292929;
  color:#fff;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
}

.success{
  background:#123b21;
  color:#75e69b;
}

.error{
  background:#421919;
  color:#ff8b8b;
}

.dashboard{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.topbar button{
  width:auto;
  margin:0;
  padding:9px 14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}

.box{
  background:#171717;
  border:1px solid #292929;
  border-radius:14px;
  padding:20px;
}

.box strong{
  display:block;
  font-size:28px;
  color:#d6a928;
  margin-top:8px;
}

.section{
  margin-top:18px;
}

.hidden{
  display:none!important;
}

.loading{
  text-align:center;
  padding:20px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen">

    <div class="logo">
      <h1>RFTC <span>SISTEMA</span></h1>
      <p>Gestão para academias de lutas</p>
    </div>

    <div class="card">

      <h2>Entrar</h2>
      <p class="subtitle">Acesse sua conta</p>

      <input
        id="loginEmail"
        type="email"
        placeholder="E-mail"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Senha"
      >

      <button onclick="login()">
        ENTRAR
      </button>

      <button
        class="secondary"
        onclick="showRegister()">
        CRIAR CONTA
      </button>

      <div id="loginMessage" class="message"></div>

    </div>
  </div>


  <!-- CADASTRO -->
  <div id="registerScreen" class="hidden">

    <div class="logo">
      <h1>RFTC <span>SISTEMA</span></h1>
      <p>Cadastre sua academia</p>
    </div>

    <div class="card">

      <h2>Criar conta</h2>
      <p class="subtitle">
        Comece a utilizar o RFTC Sistema
      </p>

      <input
        id="registerName"
        type="text"
        placeholder="Nome do responsável"
      >

      <input
        id="registerEmail"
        type="email"
        placeholder="E-mail"
      >

      <input
        id="registerPhone"
        type="tel"
        placeholder="Telefone / WhatsApp"
      >

      <input
        id="registerPassword"
        type="password"
        placeholder="Senha"
      >

      <button onclick="register()">
        CRIAR MINHA CONTA
      </button>

      <button
        class="secondary"
        onclick="showLogin()">
        VOLTAR PARA LOGIN
      </button>

      <div id="registerMessage" class="message"></div>

    </div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <div class="topbar">
      <div>
        <h2>RFTC Sistema</h2>
        <p id="userEmail" class="subtitle"></p>
      </div>

      <button onclick="logout()">
        Sair
      </button>
    </div>

    <div class="card">

      <h2>Dashboard</h2>
      <p class="subtitle">
        Gestão da sua academia
      </p>

      <div class="grid">

        <div class="box">
          Academias
          <strong id="academyCount">0</strong>
        </div>

        <div class="box">
          Alunos
          <strong id="studentCount">0</strong>
        </div>

        <div class="box">
          Pagamentos
          <strong id="paymentCount">0</strong>
        </div>

        <div class="box">
          Presenças
          <strong id="attendanceCount">0</strong>
        </div>

      </div>

    </div>


    <!-- CADASTRO ACADEMIA -->

    <div class="card section">

      <h2>🏢 Minha Academia</h2>

      <input
        id="academyName"
        type="text"
        placeholder="Nome da academia"
      >

      <input
        id="academyPhone"
        type="tel"
        placeholder="Telefone"
      >

      <input
        id="academyCity"
        type="text"
        placeholder="Cidade"
      >

      <button onclick="createAcademy()">
        CADASTRAR ACADEMIA
      </button>

      <div id="academyMessage" class="message"></div>

    </div>


    <!-- ALUNO -->

    <div class="card section">

      <h2>👨‍🎓 Novo aluno</h2>

      <input
        id="studentName"
        type="text"
        placeholder="Nome do aluno"
      >

      <input
        id="studentEmail"
        type="email"
        placeholder="E-mail"
      >

      <input
        id="studentPhone"
        type="tel"
        placeholder="Telefone"
      >

      <select id="studentModality">
        <option value="Muay Thai">Muay Thai</option>
        <option value="Boxe">Boxe</option>
        <option value="Corrida">Corrida</option>
        <option value="Musculação">Musculação</option>
      </select>

      <button onclick="createStudent()">
        CADASTRAR ALUNO
      </button>

      <div id="studentMessage" class="message"></div>

    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://wperzljwgnejroxkxsqe.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoIUQVsRmBtac22TWarIfQ_YC3mY-cV";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   TELAS
========================= */

function showRegister(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("registerScreen")
    .classList.remove("hidden");

}

function showLogin(){

  document
    .getElementById("registerScreen")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


/* =========================
   MENSAGEM
========================= */

function message(id,text,type){

  const el =
    document.getElementById(id);

  el.innerText = text;

  el.className =
    "message " + type;

  el.style.display = "block";
}


/* =========================
   CADASTRO
========================= */

async function register(){

  const nome =
    document.getElementById("registerName").value.trim();

  const email =
    document.getElementById("registerEmail").value.trim();

  const telefone =
    document.getElementById("registerPhone").value.trim();

  const senha =
    document.getElementById("registerPassword").value;

  if(!nome || !email || !senha){

    message(
      "registerMessage",
      "Preencha nome, e-mail e senha.",
      "error"
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signUp({

      email:email,

      password:senha,

      options:{
        data:{
          nome:nome,
          telefone:telefone
        }
      }

    });

  if(error){

    message(
      "registerMessage",
      error.message,
      "error"
    );

    return;
  }

  message(
    "registerMessage",
    "Conta criada! Verifique seu e-mail se a confirmação estiver ativada.",
    "success"
  );

}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){

    message(
      "loginMessage",
      "Preencha o e-mail e a senha.",
      "error"
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({

      email:email,
      password:password

    });

  if(error){

    message(
      "loginMessage",
      error.message,
      "error"
    );

    return;
  }

  openDashboard(data.user);

}


/* =========================
   DASHBOARD
========================= */

async function openDashboard(user){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("registerScreen")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .style.display = "block";

  document
    .getElementById("userEmail")
    .innerText = user.email;

  await loadDashboard();

}


/* =========================
   DASHBOARD DADOS
========================= */

async function loadDashboard(){

  const academy =
    await supabaseClient
      .from("academias")
      .select("*");

  const students =
    await supabaseClient
      .from("alunos")
      .select("*");

  const payments =
    await supabaseClient
      .from("pagamentos")
      .select("*");

  const attendance =
    await supabaseClient
      .from("presencas")
      .select("*");

  document
    .getElementById("academyCount")
    .innerText =
      academy.data?.length || 0;

  document
    .getElementById("studentCount")
    .innerText =
      students.data?.length || 0;

  document
    .getElementById("paymentCount")
    .innerText =
      payments.data?.length || 0;

  document
    .getElementById("attendanceCount")
    .innerText =
      attendance.data?.length || 0;

}


/* =========================
   ACADEMIA
========================= */

async function createAcademy(){

  const name =
    document.getElementById("academyName").value.trim();

  const phone =
    document.getElementById("academyPhone").value.trim();

  const city =
    document.getElementById("academyCity").value.trim();

  if(!name){

    message(
      "academyMessage",
      "Informe o nome da academia.",
      "error"
    );

    return;
  }

  const {
    data:{user}
  } =
    await supabaseClient.auth.getUser();

  const {error} =
    await supabaseClient
      .from("academias")
      .insert({

        nome:name,
        telefone:phone,
        cidade:city,
        responsavel_id:user.id

      });

  if(error){

    message(
      "academyMessage",
      error.message,
      "error"
    );

    return;
  }

  message(
    "academyMessage",
    "Academia cadastrada com sucesso!",
    "success"
  );

  loadDashboard();

}


/* =========================
   ALUNO
========================= */

async function createStudent(){

  const nome =
    document.getElementById("studentName").value.trim();

  const email =
    document.getElementById("studentEmail").value.trim();

  const telefone =
    document.getElementById("studentPhone").value.trim();

  const modalidade =
    document.getElementById("studentModality").value;

  if(!nome){

    message(
      "studentMessage",
      "Informe o nome do aluno.",
      "error"
    );

    return;
  }

  const academy =
    await supabaseClient
      .from("academias")
      .select("id")
      .limit(1)
      .single();

  if(academy.error){

    message(
      "studentMessage",
      "Cadastre uma academia primeiro.",
      "error"
    );

    return;
  }

  const {error} =
    await supabaseClient
      .from("alunos")
      .insert({

        academia_id:academy.data.id,
        nome:nome,
        email:email,
        telefone:telefone,
        modalidade:modalidade

      });

  if(error){

    message(
      "studentMessage",
      error.message,
      "error"
    );

    return;
  }

  message(
    "studentMessage",
    "Aluno cadastrado com sucesso!",
    "success"
  );

  document
    .getElementById("studentName")
    .value = "";

  document
    .getElementById("studentEmail")
    .value = "";

  document
    .getElementById("studentPhone")
    .value = "";

  loadDashboard();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  document
    .getElementById("dashboard")
    .style.display = "none";

  showLogin();

}


/* =========================
   VERIFICAR SESSÃO
========================= */

async function checkSession(){

  const {
    data:{session}
  } =
    await supabaseClient.auth.getSession();

  if(session){

    openDashboard(session.user);

  }

}


/* =========================
   INICIAR
========================= */

checkSession();

</script>

</body>
</html>
