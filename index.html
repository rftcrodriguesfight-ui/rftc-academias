<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFTC Academias</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 25px 20px;
    }

    .logo {
      text-align: center;
      margin-top: 35px;
      margin-bottom: 40px;
    }

    .logo h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .logo span {
      color: #d4af37;
    }

    .logo p {
      margin-top: 8px;
      color: #aaa;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .card {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin-bottom: 10px;
      font-size: 23px;
    }

    .card p {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    .btn-secundario {
      background: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      margin-top: 12px;
    }

    .recursos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .recurso {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
    }

    .recurso strong {
      display: block;
      margin-bottom: 6px;
      color: #d4af37;
    }

    .recurso small {
      color: #999;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 35px;
      padding-bottom: 20px;
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="logo">
      <h1>RFTC <span>ACADEMIAS</span></h1>
      <p>GESTÃO INTELIGENTE PARA ACADEMIAS DE LUTAS</p>
    </section>

    <section class="card">
      <h2>Gerencie sua academia</h2>

      <p>
        Cadastre seus alunos, controle mensalidades
